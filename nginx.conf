server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # App shell: always revalidate so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Manifest changes every time a run is ingested — never cache it.
    location = /data/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Run files are immutable once written; let browsers cache them hard.
    location ~ \.out$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
